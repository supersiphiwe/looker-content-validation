name: Looker Content Validation

on:
  schedule:
    # 6am, 12pm, 6pm SAST (UTC+2) — GitHub cron is UTC-only.
    - cron: '0 4,10,16 * * *'
  workflow_dispatch: {}      # lets you trigger it by hand from the Actions tab

# Never let two runs overlap — both commit to results/, and a concurrent
# push would make one of them fail.
concurrency:
  group: looker-content-validation
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # needed to commit the saved report back to the repo
    steps:
      - name: Check out repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run content validation
        env:
          LOOKERSDK_BASE_URL: ${{ secrets.LOOKERSDK_BASE_URL }}
          LOOKERSDK_CLIENT_ID: ${{ secrets.LOOKERSDK_CLIENT_ID }}
          LOOKERSDK_CLIENT_SECRET: ${{ secrets.LOOKERSDK_CLIENT_SECRET }}
          WEBHOOK_URL: ${{ secrets.SLACK_WEBHOOK_URL }}
        run: python content_validation.py

      - name: Commit saved report
        if: always()
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ -z "$(ls -A results 2>/dev/null)" ]; then
            echo "No new report to commit."
            exit 0
          fi
          git add results/
          git diff --cached --quiet && echo "No new report to commit." || \
            (git commit -m "Add Looker content validation report [skip ci]" && \
             git pull --rebase origin main && git push)